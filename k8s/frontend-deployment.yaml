apiVersion: apps/v1
Kind: Deployment
metadata:
  name: frontend
  namespace: devops-project 

spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend 
  
  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend 
          image: cheikh9708/frontend:latest

          ports:
            - containerPort: 80 


            
