version: '3'

services:

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
  
  backend:
    build: ./backend
    ports:
      - "5000:5000"

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: login_db
      POSTGRES_USER: cheikh
      POSTGRES_PASSWORD: cheikh123
    
    depends_on:
     - postgres
  
  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: login-db
      POSTGRES_USER: cheikh
      POSTGRES_PASSWORD: cheikh123

    ports:
      - "5432:5432"
